name: cooksta-api
services:
  mongodb:
    container_name: mongodb
    image: mongodb/mongodb-community-server:7.0.7-ubuntu2204
    ports:
      - "1234:27017"
    environment:
      - MONGODB_INITDB_DATABASE=cooksta
      - MONGODB_INITDB_ROOT_USERNAME=root
      - MONGODB_INITDB_ROOT_PASSWORD=rootPW
    volumes:
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/mongodb-init.js:ro
      - ./init:/init:ro
      - ./mongodb-init.sh:/docker-entrypoint-initdb.d/mongodb-init.sh:ro
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: "mongosh --eval \"db.runCommand({ ping: 1 })\""
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  express:
    container_name: express
    build:
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  mongodb-data:
  mongodb-config: