image: docker:24
services:
  - docker:24-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  EXPRESS_PATH: $CI_REGISTRY_IMAGE/express
  MONGODB_PATH: $CI_REGISTRY_IMAGE/mongodb
  EXPRESS_TAG: $EXPRESS_PATH:$CI_COMMIT_SHORT_SHA
  MONGODB_TAG: $MONGODB_PATH:$CI_COMMIT_SHORT_SHA

stages:
  - build

.default_rules:
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
      when: never
    - changes:
        - "README.md"
        - "openapi.yaml"
        - "eslint.config.mjs"
      when: never
    - when: always

before_script:
  - echo "Logging in to container registry..."
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

express:
  stage: build
  script:
    - echo "Building image..."
    - docker build -t $EXPRESS_TAG -f express.Dockerfile .
    - echo "Image built successfully. Tagging as latest..."
    - docker tag $EXPRESS_TAG $EXPRESS_PATH:latest
    - echo "Image tagged successfully. Pushing..."
    - docker push $EXPRESS_TAG
    - docker push $EXPRESS_PATH:latest
    - echo "Image pushed successfully."
  rules:
    - !reference [.default_rules, rules]

mongodb:
  stage: build
  script:
    - echo "Building image..."
    - docker build -t $MONGODB_TAG -f mongodb.Dockerfile .
    - echo "Image built successfully. Tagging as latest..."
    - docker tag $MONGODB_TAG $MONGODB_PATH:latest
    - echo "Image tagged successfully. Pushing..."
    - docker push $MONGODB_TAG
    - docker push $MONGODB_PATH:latest
    - echo "Image pushed successfully."
  rules:
    - !reference [.default_rules, rules]
