openapi: 3.0.1
info:
  title: Cooksta API
  description: API for managing users and their avatars in Cooksta.
  version: 1.0.0
servers:
  - url: http://localhost:3000

paths:
  /api/users/{userId}/avatar:
    get:
      summary: Get a user's avatar.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            description: The ID of the user.
      responses:
        '200':
          description: The avatar image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/users/{userId}:
    get:
      summary: Get a user's details.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user.
      responses:
        '200':
          description: The user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }


    put:
      summary: Replace a user's details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user.
      responses:
        '200':
          description: The updated user ID.
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    patch:
      summary: Update parts of a user's details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/User'
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user.
      responses:
        '200':
          description: The updated user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    delete:
      summary: Delete a user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user.
      responses:
        '204':
          description: User deleted.
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/users/:
    post:
      summary: Create a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: The user's avatar image.
                user:
                  $ref: '#/components/schemas/User'
      responses:
        '201':
          description: The created user details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Server error.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          nullable: true
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
        biography:
          type: string
          minLength: 1
          maxLength: 500
        favorites:
          type: array
          items:
            type: string
        shoppingList:
          type: array
          items:
            type: object
            additionalProperties:
              type: integer
              minimum: 1
        isPrivate:
          type: boolean
    UserResponseBody:
      allOf:
        - $ref: '#/components/schemas/User'
        - required: [id]
    Recipe:
      type: object
      properties:
        id:
          type: string
          nullable: true
        creatorId:
          type: string
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 1
        ingredients:
          type: object
          additionalProperties:
            type: number
            nullable: true
        portions:
          type: integer
          minimum: 1
        categories:
          type: array
          items:
            type: string
            enum: [ asian, baking, dessert, drink, main, italian, quick, soup, vegetarian ]
          minItems: 1
          maxItems: 3
        isPrivate:
          type: boolean
    RecipeResponseBody:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - required: [id]